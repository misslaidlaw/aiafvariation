<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Storyboard Studio</title>
<style>
  :root { --bg:#0f0f12; --panel:#1a1a20; --line:#2c2c35; --text:#ececf1; --muted:#9a9aa8; --accent:#7c6cf0; --warn:#f2b441; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 system-ui,sans-serif; }
  header { padding:16px; border-bottom:1px solid var(--line); }
  h1 { margin:0; font-size:20px; }
  #status { color:var(--warn); font-size:13px; margin-top:4px; }
  nav { display:flex; gap:4px; overflow-x:auto; padding:12px 16px; border-bottom:1px solid var(--line); }
  nav button { background:none; color:var(--muted); border:1px solid var(--line); border-radius:999px; padding:6px 12px; white-space:nowrap; cursor:pointer; }
  nav button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
  main { max-width:960px; margin:0 auto; padding:16px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; margin:12px 0; }
  .card h3 { margin:0 0 6px; font-size:16px; }
  .meta { color:var(--muted); font-size:13px; }
  textarea, input, select { width:100%; background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  textarea { min-height:90px; resize:vertical; }
  .scene-text { font-family:"Courier New",monospace; min-height:200px; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  button.go { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; }
  button.go:disabled { opacity:.5; cursor:default; }
  .msg { font-size:13px; color:var(--warn); }
  .media img, .media video { max-width:100%; border-radius:8px; margin-top:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:12px; }
  .empty { color:var(--muted); padding:24px 0; }
  header { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap; }
  .tools { display:flex; gap:6px; flex-wrap:wrap; }
  .tools button { background:none; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; font:inherit; font-size:13px; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:12px; width:min(480px, calc(100vw - 32px)); padding:18px; }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h2 { margin:0 0 4px; font-size:18px; }
  dialog a { color:var(--accent); }
  .check { display:flex; gap:8px; align-items:center; margin-top:12px; font-size:14px; color:var(--text); }
  .check input { width:auto; }
  .ok { color:#5fd08a; }
  details.card summary { cursor:pointer; font-weight:600; }
  details.card[open] summary { margin-bottom:8px; }
  label { font-size:13px; color:var(--muted); display:block; margin-top:8px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Storyboard Studio</h1>
    <div id="status"></div>
  </div>
  <div class="tools">
    <button id="openKeys">🔑 API keys</button>
    <button id="export">Export project</button>
    <button id="import">Import project</button>
    <button id="reset">New project</button>
    <input id="importFile" type="file" accept="application/json" hidden>
  </div>
</header>
<dialog id="keys">
  <h2>Bring your own API keys</h2>
  <p class="meta">Your keys are kept in this browser only. They are sent to this app's server with each
    request so it can call the AI services for you, and are never saved there.</p>
  <label for="anthropicKey">Anthropic key – optional: writes the screenplay, prompts and sheets in one click.
    Without it, use “Paste from Claude” with your normal Claude account –
    <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">get one</a></label>
  <input id="anthropicKey" type="password" autocomplete="off" placeholder="sk-ant-...">
  <label for="pikaKey">Pika key (images and video) –
    <a href="https://dev.pika.art/login" target="_blank" rel="noopener">get one</a></label>
  <input id="pikaKey" type="password" autocomplete="off" placeholder="pk_...">
  <label class="check"><input id="remember" type="checkbox"> Remember on this device</label>
  <p class="meta">Unticked, the keys are forgotten when you close this tab. Only tick it on your own computer.</p>
  <div class="row">
    <button class="go" id="saveKeys">Save</button>
    <button id="clearKeys" style="background:none;color:var(--muted);border:0;cursor:pointer;font:inherit">Forget keys</button>
  </div>
</dialog>
<nav id="tabs"></nav>
<main id="view"></main>

<script>
const STAGES = [
  ["idea", "1. Idea"], ["screenplay", "2. Screenplay"], ["prompts", "3. Shot prompts"],
  ["characters", "4. Characters"], ["locations", "5. Locations"], ["props", "6. Props"],
  ["video", "7. Video"],
];
let project = {};
let stage = "idea";

// --- helpers -------------------------------------------------------------
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of kids) if (k != null) n.append(k);
  return n;
};
// Browser storage can be unavailable (private mode, blocked site data): never let it break the app.
const store = {
  get(area, k) { try { return window[area].getItem(k); } catch { return null; } },
  set(area, k, v) { try { window[area].setItem(k, v); return true; } catch { return false; } },
  del(area, k) { try { window[area].removeItem(k); } catch {} },
};
const KEY_NAMES = ["anthropicKey", "pikaKey"];
const getKey = (k) => store.get("sessionStorage", k) || store.get("localStorage", k) || "";
let serverKeys = {};

async function api(method, path, body) {
  const headers = { "content-type": "application/json" };
  if (getKey("anthropicKey")) headers["x-anthropic-key"] = getKey("anthropicKey");
  if (getKey("pikaKey")) headers["x-pika-key"] = getKey("pikaKey");
  const r = await fetch(path, { method, headers, body: body && JSON.stringify(body) });
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
// Each person's project lives in their own browser, not on the server.
function save() {
  if (!store.set("localStorage", "project", JSON.stringify(project))) {
    document.getElementById("status").textContent = "Couldn't autosave in this browser. Use Export project to keep your work.";
  }
}
function editable(obj, key, opts = {}) {
  const t = el(opts.input ? "input" : "textarea", { value: obj[key] ?? "", className: opts.className || "" });
  t.oninput = () => { obj[key] = t.value; save(); };
  return t;
}
// Runs a slow action with button + message feedback.
function action(label, fn) {
  const msg = el("span", { className: "msg" });
  const btn = el("button", { className: "go", textContent: label });
  btn.onclick = async () => {
    btn.disabled = true; msg.textContent = "Working…";
    try { await fn(); msg.textContent = ""; render(); }
    catch (e) { msg.textContent = e.message; }
    finally { btn.disabled = false; }
  };
  return el("div", { className: "row" }, btn, msg);
}
function mediaFor(item) {
  const box = el("div", { className: "media" });
  if (item.imageUrl) box.append(el("img", { src: item.imageUrl, alt: item.name || item.description || "" }));
  if (item.videoUrl) box.append(el("video", { src: item.videoUrl, controls: true }));
  return box;
}
const imageButton = (item) => action(item.imageUrl ? "Regenerate image" : "Generate image", async () => {
  const { imageUrl } = await api("POST", "/api/image", { prompt: [project.breakdown?.styleGuide, item.imagePrompt].filter(Boolean).join("\n\n") });
  item.imageUrl = imageUrl; save();
});
const needs = (what) => el("p", { className: "empty", textContent: `Finish "${what}" first.` });

// --- "Paste from Claude": do the writing steps in a Claude chat, no API key needed.
const SCREENPLAY_SHAPE = `{
  "title": "string",
  "logline": "string",
  "scenes": [
    { "number": 1, "heading": "INT. DINER - NIGHT", "summary": "one line", "text": "full scene in screenplay format: action and dialogue" }
  ]
}`;
const BREAKDOWN_SHAPE = `{
  "styleGuide": "one paragraph visual style shared by every image and video prompt",
  "characters": [ { "name": "", "role": "", "appearance": "", "wardrobe": "", "personality": "", "imagePrompt": "character sheet: full body, neutral background" } ],
  "locations": [ { "name": "", "description": "", "mood": "", "lighting": "", "imagePrompt": "establishing shot, no characters" } ],
  "props": [ { "name": "", "description": "", "significance": "", "imagePrompt": "product-style shot on a neutral background" } ],
  "shots": [ { "sceneNumber": 1, "shotType": "wide / medium / close-up", "description": "", "imagePrompt": "keyframe prompt", "videoPrompt": "camera move and action over ~5 seconds" } ]
}`;
const FORMAT_RULE = "Reply with ONLY valid JSON in exactly this shape (no commentary, no markdown):";

const screenplayPrompt = () => `You are a professional screenwriter. Write tight, visual short-film screenplays that can be produced with AI image and video generation: few locations, a small cast, strong visual moments.

Idea: ${project.idea.text}

Write a short film screenplay with about ${project.idea.scenes} scenes.

${FORMAT_RULE}
${SCREENPLAY_SHAPE}`;

const breakdownPrompt = () => `You are a film pre-production designer. Break this screenplay into consistent visual reference sheets and shot prompts for AI image and video models. Describe each character, location and prop once in precise visual detail, then reuse those exact descriptions word for word inside every shot prompt so the generated images stay consistent. Create 1-3 shots per scene.

Screenplay:
${JSON.stringify(project.screenplay)}

${FORMAT_RULE}
${BREAKDOWN_SHAPE}`;

// Accepts Claude's reply even if it's wrapped in ```json fences or has text around it.
function parseReply(text) {
  const start = text.indexOf("{"), end = text.lastIndexOf("}");
  if (start < 0 || end < start) throw new Error("Couldn't find JSON in that reply. Paste Claude's whole answer.");
  try { return JSON.parse(text.slice(start, end + 1)); }
  catch { throw new Error("That reply isn't complete JSON. Ask Claude to “reply with only the JSON” and paste again."); }
}
const str = (v) => (typeof v === "string" ? v : v == null ? "" : String(v));
function cleanScreenplay(j) {
  if (!Array.isArray(j.scenes) || !j.scenes.length) throw new Error("No scenes found in that reply.");
  return {
    title: str(j.title), logline: str(j.logline),
    scenes: j.scenes.map((s, i) => ({ number: Number(s.number) || i + 1, heading: str(s.heading), summary: str(s.summary), text: str(s.text) })),
  };
}
function cleanBreakdown(j) {
  if (!Array.isArray(j.shots) || !j.shots.length) throw new Error("No shots found in that reply.");
  const list = (a, keys) => (Array.isArray(a) ? a : []).map((x) => Object.fromEntries(keys.map((k) => [k, str(x?.[k])])));
  return {
    styleGuide: str(j.styleGuide),
    characters: list(j.characters, ["name", "role", "appearance", "wardrobe", "personality", "imagePrompt"]),
    locations: list(j.locations, ["name", "description", "mood", "lighting", "imagePrompt"]),
    props: list(j.props, ["name", "description", "significance", "imagePrompt"]),
    shots: j.shots.map((x) => ({ ...Object.fromEntries(["shotType", "description", "imagePrompt", "videoPrompt"].map((k) => [k, str(x?.[k])])), sceneNumber: Number(x?.sceneNumber) || 1 })),
  };
}

function pastePanel({ buildPrompt, ready, onUse }) {
  const box = el("details", { className: "card" });
  box.append(el("summary", { textContent: "No Anthropic key? Paste from Claude instead" }));
  const promptBox = el("textarea", { readOnly: true, rows: 6 });
  const reply = el("textarea", { rows: 6, placeholder: "Paste Claude's reply here" });
  const copyMsg = el("span", { className: "msg" });
  const copyBtn = el("button", { className: "go", textContent: "1. Copy prompt" });
  copyBtn.onclick = async () => {
    const err = ready(); if (err) { copyMsg.textContent = err; return; }
    promptBox.value = buildPrompt();
    try { await navigator.clipboard.writeText(promptBox.value); copyMsg.textContent = "Copied. Paste it into a Claude chat."; }
    catch { promptBox.select(); copyMsg.textContent = "Select the text above and copy it."; }
  };
  box.addEventListener("toggle", () => { if (box.open && !ready()) promptBox.value = buildPrompt(); });
  box.append(
    el("p", { className: "meta", textContent: "Open claude.ai (or the Claude app), paste the prompt, then copy Claude's whole reply back here." }),
    el("div", { className: "row" }, copyBtn, copyMsg),
    promptBox,
    el("label", { textContent: "2. Claude's reply" }), reply,
    action("3. Use this reply →", async () => onUse(parseReply(reply.value))));
  return box;
}

// --- stages --------------------------------------------------------------
const views = {
  idea() {
    project.idea ??= { text: "", scenes: 5 };
    const scenes = el("input", { type: "number", min: 1, max: 15, value: project.idea.scenes });
    scenes.oninput = () => { project.idea.scenes = Number(scenes.value); save(); };
    return el("div", {},
      el("div", { className: "card" },
        el("h3", { textContent: "What's your film about?" }),
        el("p", { className: "meta", textContent: "A sentence or a paragraph: characters, setting, the twist, the feeling." }),
        editable(project.idea, "text"),
        el("label", { textContent: "Number of scenes" }), scenes,
        action("Write screenplay →", async () => {
          if (!project.idea.text.trim()) throw new Error("Describe your idea first.");
          project.screenplay = await api("POST", "/api/screenplay", { idea: project.idea.text, scenes: project.idea.scenes });
          delete project.breakdown; save(); stage = "screenplay";
        })),
      pastePanel({
        ready: () => (project.idea.text.trim() ? "" : "Describe your idea first."),
        buildPrompt: screenplayPrompt,
        onUse: (j) => { project.screenplay = cleanScreenplay(j); delete project.breakdown; save(); stage = "screenplay"; },
      }));
  },
  screenplay() {
    const sp = project.screenplay;
    if (!sp) return needs("Idea");
    return el("div", {},
      el("div", { className: "card" },
        el("label", { textContent: "Title" }), editable(sp, "title", { input: true }),
        el("label", { textContent: "Logline" }), editable(sp, "logline")),
      ...sp.scenes.map((s) => el("div", { className: "card" },
        el("h3", { textContent: `Scene ${s.number}: ${s.heading}` }),
        el("p", { className: "meta", textContent: s.summary }),
        editable(s, "text", { className: "scene-text" }))),
      el("div", { className: "card" },
        el("p", { className: "meta", textContent: "Edit anything above, then break it down into shots and reference sheets." }),
        action("Create prompts & sheets →", async () => {
          project.breakdown = await api("POST", "/api/breakdown", { screenplay: sp });
          save(); stage = "prompts";
        })),
      pastePanel({
        ready: () => "",
        buildPrompt: breakdownPrompt,
        onUse: (j) => { project.breakdown = cleanBreakdown(j); save(); stage = "prompts"; },
      }));
  },
  prompts() {
    const b = project.breakdown;
    if (!b) return needs("Screenplay");
    return el("div", {},
      el("div", { className: "card" }, el("h3", { textContent: "Visual style (applied to every image)" }), editable(b, "styleGuide")),
      ...b.shots.map((s, i) => el("div", { className: "card" },
        el("h3", { textContent: `Shot ${i + 1} · Scene ${s.sceneNumber} · ${s.shotType}` }),
        el("p", { className: "meta", textContent: s.description }),
        el("label", { textContent: "Image prompt (keyframe)" }), editable(s, "imagePrompt"),
        imageButton(s), mediaFor({ imageUrl: s.imageUrl }))));
  },
  characters: () => sheet("characters", ["role", "appearance", "wardrobe", "personality"]),
  locations: () => sheet("locations", ["description", "mood", "lighting"]),
  props: () => sheet("props", ["description", "significance"]),
  video() {
    const b = project.breakdown;
    if (!b) return needs("Screenplay");
    return el("div", {},
      el("p", { className: "meta", textContent: "Each shot animates its keyframe image from step 3 when there is one." }),
      ...b.shots.map((s, i) => el("div", { className: "card" },
        el("h3", { textContent: `Shot ${i + 1} · Scene ${s.sceneNumber}` }),
        el("label", { textContent: "Motion prompt" }), editable(s, "videoPrompt"),
        action(s.videoUrl ? "Regenerate video" : "Generate video", async () => {
          const { videoUrl } = await api("POST", "/api/video", { prompt: s.videoPrompt, imageUrl: s.imageUrl });
          s.videoUrl = videoUrl; save();
        }),
        mediaFor({ imageUrl: s.videoUrl ? null : s.imageUrl, videoUrl: s.videoUrl }))));
  },
};

function sheet(kind, fields) {
  const b = project.breakdown;
  if (!b) return needs("Screenplay");
  return el("div", { className: "grid" }, ...b[kind].map((item) => el("div", { className: "card" },
    el("h3", { textContent: item.name }),
    ...fields.flatMap((f) => [el("label", { textContent: f }), editable(item, f)]),
    el("label", { textContent: "Image prompt" }), editable(item, "imagePrompt"),
    imageButton(item), mediaFor({ imageUrl: item.imageUrl, name: item.name }))));
}

function render() {
  const tabs = document.getElementById("tabs");
  tabs.replaceChildren(...STAGES.map(([id, label]) => {
    const b = el("button", { textContent: label, className: id === stage ? "on" : "" });
    b.onclick = () => { stage = id; render(); };
    return b;
  }));
  document.getElementById("view").replaceChildren(views[stage]());
}

function showKeyStatus() {
  const writer = getKey("anthropicKey") || serverKeys.anthropic;
  const pika = getKey("pikaKey") || serverKeys.pika;
  const st = document.getElementById("status");
  st.className = pika ? "ok" : "";
  st.textContent = [
    writer ? "Writing: Anthropic key ready" : "Writing: paste from Claude (or add an Anthropic key)",
    pika ? "Images & video: Pika key ready" : "Images & video: add your Pika key",
  ].join(" · ");
}

// --- keys dialog
const dlg = document.getElementById("keys");
document.getElementById("openKeys").onclick = () => {
  for (const k of KEY_NAMES) document.getElementById(k).value = getKey(k);
  document.getElementById("remember").checked = Boolean(store.get("localStorage", "anthropicKey") || store.get("localStorage", "pikaKey"));
  dlg.showModal();
};
document.getElementById("saveKeys").onclick = () => {
  const remember = document.getElementById("remember").checked;
  for (const k of KEY_NAMES) {
    const v = document.getElementById(k).value.trim();
    store.del("localStorage", k); store.del("sessionStorage", k);
    if (v) store.set(remember ? "localStorage" : "sessionStorage", k, v);
  }
  dlg.close(); showKeyStatus();
};
document.getElementById("clearKeys").onclick = () => {
  for (const k of KEY_NAMES) { store.del("localStorage", k); store.del("sessionStorage", k); document.getElementById(k).value = ""; }
  dlg.close(); showKeyStatus();
};

// --- project file tools
document.getElementById("export").onclick = () => {
  const name = (project.screenplay?.title || "storyboard").replace(/[^a-z0-9]+/gi, "-").toLowerCase();
  const a = el("a", { href: URL.createObjectURL(new Blob([JSON.stringify(project, null, 2)], { type: "application/json" })), download: name + ".json" });
  a.click(); URL.revokeObjectURL(a.href);
};
const fileInput = document.getElementById("importFile");
document.getElementById("import").onclick = () => fileInput.click();
fileInput.onchange = async () => {
  try { project = JSON.parse(await fileInput.files[0].text()); save(); stage = "idea"; render(); }
  catch { alert("That file isn't a Storyboard Studio project."); }
  fileInput.value = "";
};
document.getElementById("reset").onclick = () => {
  if (confirm("Start a new project? Export first if you want to keep this one.")) { project = {}; save(); stage = "idea"; render(); }
};

(async () => {
  try { project = JSON.parse(store.get("localStorage", "project") || "{}"); } catch { project = {}; }
  render();
  serverKeys = (await api("GET", "/api/status").catch(() => ({}))).serverKeys || {};
  showKeyStatus();
  if (!getKey("pikaKey") && !serverKeys.pika && !getKey("anthropicKey")) dlg.showModal();
})();
</script>
</body>
</html>
